<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7fcff"/>
    <stop offset="1" stop-color="#e9f6ff"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0875e1"/>
    <stop offset="1" stop-color="#0b57d0"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#173b68" flood-opacity=".16"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
</defs>

<!-- soft background -->
<rect width="1200" height="630" fill="url(#bg)"/>
<ellipse cx="1000" cy="350" rx="250" ry="150" fill="#d8f1ff" opacity=".72" filter="url(#soft)"/>

<!-- browser/dashboard frame -->
<rect x="44" y="35" width="1112" height="560" rx="18" fill="#06285f" filter="url(#shadow)"/>
<rect x="54" y="45" width="1092" height="540" rx="14" fill="#fff"/>

<!-- top bar -->
<rect x="54" y="45" width="1092" height="64" rx="14" fill="#fff"/>
<rect x="54" y="95" width="1092" height="1" fill="#e8eef5"/>

<!-- logo -->
<rect x="75" y="62" width="32" height="32" rx="8" fill="#0875e1"/>
<text x="91" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#fff">B</text>
<text x="119" y="83" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#102b68">BingoPay</text>

<!-- search -->
<rect x="335" y="61" width="390" height="31" rx="15.5" fill="#f5f8fc"/>
<text x="355" y="81" font-family="Arial,sans-serif" font-size="11" fill="#a1adbd">Search transactions, services...</text>
<circle cx="1090" cy="76" r="14" fill="#f3f7fb"/>
<circle cx="1118" cy="76" r="14" fill="#f3f7fb"/>

<!-- sidebar -->
<rect x="70" y="126" width="190" height="439" rx="10" fill="#f8fbff"/>
<rect x="82" y="143" width="166" height="42" rx="8" fill="url(#blue)"/>
<text x="103" y="169" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">Dashboard</text>

<g font-family="Arial,sans-serif" font-size="11" fill="#526783">
  <text x="103" y="215">Money Transfer</text>
  <text x="103" y="250">AEPS</text>
  <text x="103" y="285">Recharges</text>
  <text x="103" y="320">Bill Payments</text>
  <text x="103" y="355">Commission</text>
  <text x="103" y="390">Reports</text>
  <text x="103" y="425">Support</text>
</g>

<g fill="#dceeff">
  <circle cx="91" cy="211" r="5"/><circle cx="91" cy="246" r="5"/><circle cx="91" cy="281" r="5"/>
  <circle cx="91" cy="316" r="5"/><circle cx="91" cy="351" r="5"/><circle cx="91" cy="386" r="5"/><circle cx="91" cy="421" r="5"/>
</g>

<!-- main -->
<text x="292" y="157" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#102b68">Dashboard</text>

<!-- stat cards -->
<g>
  <rect x="292" y="180" width="190" height="86" rx="10" fill="#fff" stroke="#e6eef7"/>
  <rect x="494" y="180" width="190" height="86" rx="10" fill="#fff" stroke="#e6eef7"/>
  <rect x="696" y="180" width="190" height="86" rx="10" fill="#fff" stroke="#e6eef7"/>
  <rect x="898" y="180" width="190" height="86" rx="10" fill="#fff" stroke="#e6eef7"/>

  <circle cx="318" cy="222" r="17" fill="#e8f5ff"/><text x="318" y="227" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#0875e1">₹</text>
  <circle cx="520" cy="222" r="17" fill="#e9fbf1"/><text x="520" y="227" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#20a866">₹</text>
  <circle cx="722" cy="222" r="17" fill="#e8f5ff"/><text x="722" y="227" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#0875e1">↗</text>
  <circle cx="924" cy="222" r="17" fill="#fff0e7"/><text x="924" y="227" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#ee7c36">₹</text>

  <g font-family="Arial,sans-serif" fill="#102b68">
    <text x="347" y="217" font-size="13" font-weight="600">Wallet Balance</text>
    <text x="347" y="241" font-size="18" font-weight="800">₹25,480</text>
    <text x="549" y="217" font-size="13" font-weight="600">Today's Sales</text>
    <text x="549" y="241" font-size="18" font-weight="800">₹12,320</text>
    <text x="751" y="217" font-size="13" font-weight="600">Total Transactions</text>
    <text x="751" y="241" font-size="18" font-weight="800">324</text>
    <text x="953" y="217" font-size="13" font-weight="600">Total Commission</text>
    <text x="953" y="241" font-size="18" font-weight="800">₹2,890</text>
  </g>
</g>

<!-- chart -->
<rect x="292" y="287" width="575" height="250" rx="11" fill="#fff" stroke="#e6eef7"/>
<text x="314" y="317" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#526783">Transaction Overview</text>
<rect x="754" y="301" width="91" height="25" rx="7" fill="#f6f9fd"/>
<text x="768" y="318" font-family="Arial,sans-serif" font-size="10" fill="#526783">This Month⌄</text>

<!-- grid -->
<g stroke="#edf2f7" stroke-width="1">
  <line x1="330" y1="355" x2="835" y2="355"/><line x1="330" y1="395" x2="835" y2="395"/>
  <line x1="330" y1="435" x2="835" y2="435"/><line x1="330" y1="475" x2="835" y2="475"/>
</g>
<path d="M330 470 L395 420 L460 445 L525 385 L590 425 L655 365 L720 395 L785 350 L835 365 L835 500 L330 500 Z"
      fill="#dceeff" opacity=".75"/>
<polyline points="330,470 395,420 460,445 525,385 590,425 655,365 720,395 785,350 835,365"
          fill="none" stroke="#0875e1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

<g font-family="Arial,sans-serif" font-size="9" fill="#a0adbd">
  <text x="330" y="520">Jan</text><text x="415" y="520">Feb</text><text x="500" y="520">Mar</text>
  <text x="585" y="520">Apr</text><text x="670" y="520">May</text><text x="755" y="520">Jun</text>
</g>

<!-- recent transactions -->
<rect x="885" y="287" width="203" height="250" rx="11" fill="#fff" stroke="#e6eef7"/>
<text x="907" y="317" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#526783">Recent Transactions</text>

<g font-family="Arial,sans-serif">
  <circle cx="914" cy="360" r="16" fill="#e8f5ff"/><text x="914" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#0875e1">B</text>
  <text x="940" y="357" font-size="11" font-weight="700" fill="#526783">Money Transfer</text>
  <text x="940" y="373" font-size="9" fill="#9aa7b8">Bank Transfer</text><text x="1065" y="363" text-anchor="end" font-size="11" font-weight="700" fill="#20a866">+₹1,000</text>

  <circle cx="914" cy="416" r="16" fill="#ffe9ee"/><text x="914" y="421" text-anchor="middle" font-size="13" font-weight="700" fill="#e83d58">A</text>
  <text x="940" y="413" font-size="11" font-weight="700" fill="#526783">Airtel Recharge</text>
  <text x="940" y="429" font-size="9" fill="#9aa7b8">Mobile Recharge</text><text x="1065" y="419" text-anchor="end" font-size="11" font-weight="700" fill="#e83d58">-₹299</text>

  <circle cx="914" cy="472" r="16" fill="#e8f5ff"/><text x="914" y="477" text-anchor="middle" font-size="13" font-weight="700" fill="#0875e1">E</text>
  <text x="940" y="469" font-size="11" font-weight="700" fill="#526783">Electricity Bill</text>
  <text x="940" y="485" font-size="9" fill="#9aa7b8">Bill Payment</text><text x="1065" y="475" text-anchor="end" font-size="11" font-weight="700" fill="#e83d58">-₹1,400</text>
</g>
</svg>